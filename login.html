<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso | PRICE NICE</title>

<link rel="stylesheet" href="style.css">
</head>
<body class="fondo-login">

<div class="login-caja">

    <img src="img/LOGO PRIN.jpg" alt="Logo de la empresa" class="logo" width="80" height="80">
    <h1>PRICE NICE</h1>

    <div class="login-tabs">
        <button id="tabIngresar" class="activo">Ingresar</button>
        <button id="tabRegistrar">Crear cuenta</button>
    </div>

    <form id="formulario">

        <div class="campo" id="campoNombre" hidden>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" autocomplete="name">
        </div>

        <div class="campo">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" autocomplete="email" required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" autocomplete="current-password" required minlength="6">
        </div>

        <button type="submit" id="enviar" class="boton-principal">Ingresar</button>

        <p class="mensaje" id="mensaje"></p>

        <a href="recuperar.html" class="enlace">Olvidé mi contraseña</a>

    </form>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
