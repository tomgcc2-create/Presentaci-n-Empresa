<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso | PRICE NICE</title>

<link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://unpkg.com/bs-brain@2.0.4/components/registrations/registration-7/assets/css/registration-7.css">
</head>
<body class="fondo-login">

<!-- Registration 7 - Bootstrap Brain Component -->
<section class="bg-light p-3 p-md-4 p-xl-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-7 col-xl-6 col-xxl-5">
        <div class="card border border-light-subtle rounded-4">
          <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="row">
              <div class="col-12">
                <div class="mb-4">
                  <div class="text-center mb-4">
                    <a href="#!">
                      <img src="img/LOGO PRIN.jpg" alt="PRICE NICE Logo" width="175" height="157">
                    </a>
                  </div>
                  <!-- Pestañas Ingresar / Registrar -->
                  <div class="d-flex justify-content-center gap-3 mb-3">
                    <button id="tabIngresar" class="btn btn-primary">Ingresar</button>
                    <button id="tabRegistrar" class="btn btn-outline-primary">Registrarse</button>
                  </div>
                  <h3 class="fs-6 fw-normal text-secondary text-center m-0">Introduce tus datos</h3>
                </div>
              </div>
            </div>

            <!-- Mensaje de estado -->
            <div id="mensaje" class="text-center mb-3" style="min-height:1.5rem;"></div>

            <form id="formulario">
              <div class="row gy-3 overflow-hidden">
                <!-- Campos de nombre (solo visibles al registrar) -->
                <div class="col-12" id="campoNombre" hidden>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="firstName" id="nombre" placeholder="Nombre">
                    <label for="nombre" class="form-label">Primer Nombre</label>
                  </div>
                </div>
                <div class="col-12" id="campoApellido" hidden>
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" name="lastName" id="apellido" placeholder="Apellidos">
                    <label for="apellido" class="form-label">Apellidos</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating mb-3">
                    <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required>
                    <label for="email" class="form-label">Correo Electrónico</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating mb-3">
                    <input type="password" class="form-control" name="password" id="password" value="" placeholder="Password" required>
                    <label for="password" class="form-label">Contraseña</label>
                  </div>
                </div>
                <div class="col-12" id="campoTerminos" hidden>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" name="iAgree" id="iAgree">
                    <label class="form-check-label text-secondary" for="iAgree">
                     Acepto todos los: <a href="#!" class="link-primary text-decoration-none">Terminos y Condiciones</a>
                    </label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="d-grid">
                    <button id="enviar" class="btn bsb-btn-xl btn-primary" type="submit">Ingresar</button>
                  </div>
                </div>
              </div>
            </form>

            <!-- Panel cuando el usuario ya inició sesión -->
            <div id="panelLogueado" class="text-center" hidden>
              <div class="mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#ff8c00" viewBox="0 0 16 16">
                  <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                  <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
                </svg>
              </div>
              <h4 class="mb-3">¡Ya iniciaste sesión!</h4>
              <div id="correoUsuario" style="background:#fff; border:2px solid #e0e0e0; border-radius:12px; padding:12px 24px; display:inline-block; font-size:1.1rem; font-weight:500; color:#333; box-shadow:0 2px 8px rgba(0,0,0,0.07); margin-bottom:20px;">
              </div>
              <br>
              <button id="btnCerrarSesion" style="background:linear-gradient(135deg,#ff8c00,#ff6600); color:#fff; border:none; border-radius:12px; padding:12px 36px; font-size:1rem; font-weight:600; cursor:pointer; box-shadow:0 4px 15px rgba(255,140,0,0.4); transition:all 0.3s ease; margin-top:10px;">
                🚪 Cerrar Sesión
              </button>
              <p class="text-secondary mt-3" style="font-size:0.9rem;">
                <a href="Index.html" class="link-primary text-decoration-none">← Volver al inicio</a>
              </p>
            </div>
            <div class="row">
              <div class="col-12">
                <hr class="mt-5 mb-4 border-secondary-subtle">
              <p class="m-0 text-secondary text-center">¿Olvidaste tu contraseña? <a href="recuperar.html" class="link-primary text-decoration-none">Recupera tu contraseña</a></p>
              </div>
            </div>


          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script type="module" src="login.js"></script>

</body>
</html>
