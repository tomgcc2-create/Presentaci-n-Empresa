<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | PRICENICE</title>

    <link rel="stylesheet" href="style.css">
    </head>
    <body class="fondo-login">

    <div class="login-caja">

        <img src="img/LOGO PRIN.jpg" alt="Lpogo resa" class="logo" width="80" height="80">
        <h1>Recuperar contraseña</h1>

        <p class="instruccion">
            Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.
        </p>

        <form id="formulario">

            <div class="campo">

                <label for="email">Correo</label>
                <input type="email" id="email" autocomplete="email" required>

            </div>

            <button type="submit" id="enviar" class="boton-principal">Enviar enlace</button>

            <p class="mensaje" id="mensaje"></p>

        </form>

        <a href="login.html" class="enlace">Volver a iniciar sesión</a>

    </div>

    <script type="module" src="recuperar.js"></script>

</body>
</html>
