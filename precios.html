  let precioMin = null;
  let precioMax = null;
  let tiendaActual = "todas";
  let ciudadActual = "todas";

  // ── Inicializar ──
  document.addEventListener("DOMContentLoaded", () => {
    renderFiltros();
    poblarTiendas();
    poblarCiudades();
    poblarSelectEvolucion();
    renderProductos();
    actualizarResumen();

    // Construir gráfica inicial (categoría)
    construirGraficaCategoria();

    // Buscador
    document.getElementById("buscador").addEventListener("input", e => {
      busqueda = e.target.value.toLowerCase().trim();
      renderProductos();
    });

    // Ordenar por
    document.getElementById("ordenar").addEventListener("change", e => {
      ordenActual = e.target.value;
      renderProductos();
    });

    // Rango de precios
    document.getElementById("precioMin").addEventListener("input", e => {
      const val = e.target.value.trim();
      precioMin = val !== "" ? parseFloat(val) : null;
      renderProductos();
    });
    document.getElementById("precioMax").addEventListener("input", e => {
      const val = e.target.value.trim();
      precioMax = val !== "" ? parseFloat(val) : null;
      renderProductos();
    });

    // Filtro por tienda
    document.getElementById("filtroTienda").addEventListener("change", e => {
      tiendaActual = e.target.value;
      renderProductos();
    });

    // Filtro por ciudad
    document.getElementById("filtroCiudad").addEventListener("change", e => {
      ciudadActual = e.target.value;
      renderProductos();
    });

    // Botón limpiar filtros
    document.getElementById("btnLimpiar").addEventListener("click", () => {
      // Reset estado
      filtroActual = "todos";
      busqueda = "";
      ordenActual = "default";
      precioMin = null;
      precioMax = null;
      tiendaActual = "todas";
      ciudadActual = "todas";

      // Reset UI
      document.getElementById("buscador").value = "";
      document.getElementById("ordenar").value = "default";
      document.getElementById("precioMin").value = "";
      document.getElementById("precioMax").value = "";
      document.getElementById("filtroTienda").value = "todas";
      document.getElementById("filtroCiudad").value = "todas";
      document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("active"));
      const btnTodos = document.querySelector('.filtro-btn[data-filtro="todos"]');
      if (btnTodos) btnTodos.classList.add("active");

      renderProductos();
    });
  });

  // ── Poblar dropdown de tiendas ──
  function poblarTiendas() {
    const select = document.getElementById("filtroTienda");
    const tiendas = [...new Set(PRODUCTOS.map(p => p.tienda))].sort();
    tiendas.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = t;
      select.appendChild(opt);
    });
  }

  // ── Poblar dropdown de ciudades ──
  function poblarCiudades() {
    const select = document.getElementById("filtroCiudad");
    const ciudades = [...new Set(PRODUCTOS.map(p => p.ubicacion))].sort();
    ciudades.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      select.appendChild(opt);
    });
  }

  // ── Filtros de categoría ──
  function renderFiltros() {
    const contenedor = document.getElementById("filtros");

    // Botón "Todos"
    const btnTodos = crearBotonFiltro("todos", "📋 Todos");
    btnTodos.classList.add("active");
    contenedor.appendChild(btnTodos);

    // Botón por cada categoría
    Object.entries(CATEGORIAS).forEach(([clave, cat]) => {
      contenedor.appendChild(crearBotonFiltro(clave, cat.icono + " " + cat.nombre));
    });
  }

  function crearBotonFiltro(clave, texto) {
    const btn = document.createElement("button");
    btn.className = "filtro-btn";
    btn.textContent = texto;
    btn.dataset.filtro = clave;
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      filtroActual = clave;
      renderProductos();
    });
    return btn;
  }

  // ── Obtener productos filtrados y ordenados ──
  function productosFiltrados() {
    let resultado = PRODUCTOS.filter(p => {
      // Filtro de categoría
      const coincideFiltro = filtroActual === "todos" || p.categoria === filtroActual;
      if (!coincideFiltro) return false;

      // Filtro de búsqueda
      if (busqueda) {
        const texto = (p.nombre + " " + p.descripcion + " " + p.tienda + " " + CATEGORIAS[p.categoria].nombre).toLowerCase();
        if (!texto.includes(busqueda)) return false;
      }

      // Filtro de rango de precio
      if (precioMin !== null && p.precio < precioMin) return false;
      if (precioMax !== null && p.precio > precioMax) return false;

      // Filtro de tienda
      if (tiendaActual !== "todas" && p.tienda !== tiendaActual) return false;

      // Filtro de ciudad
      if (ciudadActual !== "todas" && p.ubicacion !== ciudadActual) return false;

      return true;
    });

    // Ordenamiento
    switch (ordenActual) {
      case "precio-asc":
        resultado.sort((a, b) => a.precio - b.precio);
        break;
      case "precio-desc":
        resultado.sort((a, b) => b.precio - a.precio);
        break;
      case "nombre-asc":
        resultado.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
        break;
      case "nombre-desc":
        resultado.sort((a, b) => b.nombre.localeCompare(a.nombre, "es"));
        break;
      default:
        break;
    }

    return resultado;
  }

  // ── Renderizar productos agrupados por categoría ──
  function renderProductos() {
    const contenedor = document.getElementById("contenedorProductos");
    contenedor.innerHTML = "";

    const visibles = productosFiltrados();

    // Actualizar info de resultados
    const infoDiv = document.getElementById("resultadosInfo");
    const totalFiltros = PRODUCTOS.length;
    if (visibles.length === totalFiltros) {
      infoDiv.textContent = "";
    } else {
      infoDiv.innerHTML = `Mostrando <strong>${visibles.length}</strong> de <strong>${totalFiltros}</strong> productos`;
    }

    if (visibles.length === 0) {
      contenedor.innerHTML = `
        <div class="sin-resultados">
          <span>🔍</span>
          <h5>No se encontraron productos</h5>
          <p class="text-secondary">Intenta con otra búsqueda, ajusta el rango de precio o cambia los filtros.</p>
        </div>`;
      return;
    }

    // Si hay un orden explícito (no por defecto), mostrar como lista plana
    const usarListaPlana = ordenActual !== "default";

    if (usarListaPlana) {
      const row = document.createElement("div");
      row.className = "row g-4 mb-2";

      visibles.forEach(p => {
        const cat = CATEGORIAS[p.categoria];
        const col = document.createElement("div");
        col.className = "col-12 col-sm-6 col-lg-4";
        col.innerHTML = `
          <div class="card producto-card p-4">
            <div class="card-body">
              <span class="cat-badge ${cat.clase}">${cat.icono} ${cat.nombre}</span>
              <h5 class="fw-bold mb-1">${p.nombre}</h5>
              <p class="text-secondary small mb-3">${p.descripcion}</p>
              <div class="precio-tag">${formatCOP(p.precio)}</div>
              <div class="tienda-tag">🏪 <strong>${p.tienda}</strong></div>
              <div class="tienda-tag">📍 ${p.ubicacion}${p.barrio ? ' · ' + p.barrio : ''}</div>
            </div>
          </div>`;
        row.appendChild(col);
      });

      contenedor.appendChild(row);
    } else {
      // Agrupar por categoría
      const agrupados = {};
      visibles.forEach(p => {
        if (!agrupados[p.categoria]) agrupados[p.categoria] = [];
        agrupados[p.categoria].push(p);
      });

      // Renderizar cada grupo
      const ordenCategorias = ["belleza", "higiene", "alimentos", "hogar", "bebes", "mascotas"];

      ordenCategorias.forEach(catKey => {
        if (!agrupados[catKey]) return;
        const cat = CATEGORIAS[catKey];
        const productos = agrupados[catKey];

        // Título de sección
        const titulo = document.createElement("div");
        titulo.innerHTML = `<div class="seccion-titulo">${cat.icono} ${cat.nombre}</div>`;
        contenedor.appendChild(titulo);

        // Grid de productos
        const row = document.createElement("div");
        row.className = "row g-4 mb-2";

        productos.forEach(p => {
          const col = document.createElement("div");
          col.className = "col-12 col-sm-6 col-lg-4";
          col.innerHTML = `
            <div class="card producto-card p-4">
              <div class="card-body">
                <span class="cat-badge ${cat.clase}">${cat.icono} ${cat.nombre}</span>
                <h5 class="fw-bold mb-1">${p.nombre}</h5>
                <p class="text-secondary small mb-3">${p.descripcion}</p>
                <div class="precio-tag">${formatCOP(p.precio)}</div>
                <div class="tienda-tag">🏪 <strong>${p.tienda}</strong></div>
                <div class="tienda-tag">📍 ${p.ubicacion}${p.barrio ? ' · ' + p.barrio : ''}</div>
              </div>
            </div>`;
          row.appendChild(col);
        });

        contenedor.appendChild(row);
      });
    }
  }

  // ── Formato de precio en COP ──
  function formatCOP(valor) {
    return "$ " + valor.toLocaleString("es-CO", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  // ── Resumen ──
  function actualizarResumen() {
    const total = PRODUCTOS.length;
    const categorias = new Set(PRODUCTOS.map(p => p.categoria)).size;
    const tiendas = new Set(PRODUCTOS.map(p => p.tienda)).size;
    const promedio = total > 0 ? PRODUCTOS.reduce((s, p) => s + p.precio, 0) / total : 0;

    document.getElementById("totalProductos").textContent = total;
    document.getElementById("totalCategorias").textContent = categorias;
    document.getElementById("totalTiendas").textContent = tiendas;
    document.getElementById("precioPromedio").textContent = formatCOP(promedio);
  }

  // ════════════════════════════════════════════════
  //  GRÁFICAS DE LÍNEAS
  // ════════════════════════════════════════════════

  const PALETA = [
    "#D4954D", "#775533", "#e74c3c", "#3498db",
    "#2ecc71", "#9b59b6", "#f39c12", "#1abc9c",
    "#e67e22", "#34495e", "#27ae60", "#8e44ad"
  ];

  let chartCategoria = null;
  let chartTienda = null;
  let chartEvolucion = null;

  // Genera puntos simulados de evolución histórica (últimos 6 meses) a partir del precio actual
  function simularEvolucion(precioBase) {
    const meses = 6;
    const datos = [];
    let precio = precioBase * (0.85 + Math.random() * 0.1); // precio inicial ~85-95% del actual
    for (let i = 0; i < meses; i++) {
      precio += precio * (Math.random() * 0.06 - 0.02); // variación ±3% por mes
      datos.push(Math.round(precio));
    }
    datos.push(precioBase); // último punto es el precio real actual
    return datos;
  }

  const MESES_LABELS = ["Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago"];

  function construirGraficaCategoria() {
    const ctx = document.getElementById("graficaCategoria").getContext("2d");

    // Promedio por categoría + puntos históricos simulados
    const datasets = Object.entries(CATEGORIAS).map(([clave, cat], idx) => {
      const prods = PRODUCTOS.filter(p => p.categoria === clave);
      const promActual = prods.reduce((s, p) => s + p.precio, 0) / prods.length;
      const datos = simularEvolucion(promActual);

      return {
        label: cat.icono + " " + cat.nombre,
        data: datos,
        borderColor: PALETA[idx],
        backgroundColor: PALETA[idx] + "22",
        borderWidth: 2.5,
        pointRadius: 4,
        pointHoverRadius: 7,
        tension: 0.4,
        fill: false
      };
    });

    if (chartCategoria) chartCategoria.destroy();
    chartCategoria = new Chart(ctx, {
      type: "line",
      data: { labels: MESES_LABELS, datasets },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: "Promedio de precio por categoría — últimos 7 meses (COP $)",
            font: { size: 14, weight: "bold" },
            color: "#333"
          },
          tooltip: {
            callbacks: {
              label: ctx => " " + ctx.dataset.label + ": " + formatCOP(ctx.parsed.y)
            }
          },
          legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } }
        },
        scales: {
          y: {
            beginAtZero: false,
            ticks: {
              callback: val => "$ " + val.toLocaleString("es-CO"),
              font: { size: 10 }
            },
            grid: { color: "#f0f0f0" }
          },
          x: { grid: { color: "#f5f5f5" } }
        }
      }
    });
  }

  function construirGraficaTienda() {
    const ctx = document.getElementById("graficaTienda").getContext("2d");

    const tiendas = [...new Set(PRODUCTOS.map(p => p.tienda))].sort();

    const datasets = tiendas.map((tienda, idx) => {
      const prods = PRODUCTOS.filter(p => p.tienda === tienda);
      const promActual = prods.reduce((s, p) => s + p.precio, 0) / prods.length;
      const datos = simularEvolucion(promActual);

      return {
        label: "🏪 " + tienda,
        data: datos,
        borderColor: PALETA[idx % PALETA.length],
        backgroundColor: PALETA[idx % PALETA.length] + "22",
        borderWidth: 2.5,
        pointRadius: 4,
        pointHoverRadius: 7,
        tension: 0.4,
        fill: false
      };
    });

    if (chartTienda) chartTienda.destroy();
    chartTienda = new Chart(ctx, {
      type: "line",
      data: { labels: MESES_LABELS, datasets },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: "Promedio de precio por tienda — últimos 7 meses (COP $)",
            font: { size: 14, weight: "bold" },
            color: "#333"
          },
          tooltip: {
            callbacks: {
              label: ctx => " " + ctx.dataset.label + ": " + formatCOP(ctx.parsed.y)
            }
          },
          legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } }
        },
        scales: {
          y: {
            beginAtZero: false,
            ticks: {
              callback: val => "$ " + val.toLocaleString("es-CO"),
              font: { size: 10 }
            },
            grid: { color: "#f0f0f0" }
          },
          x: { grid: { color: "#f5f5f5" } }
        }
      }
    });
  }

  function construirGraficaEvolucion(nombreProducto) {
    const ctx = document.getElementById("graficaEvolucion").getContext("2d");
    const prod = PRODUCTOS.find(p => p.nombre === nombreProducto);
    if (!prod) return;

    const datos = simularEvolucion(prod.precio);

    if (chartEvolucion) chartEvolucion.destroy();
    chartEvolucion = new Chart(ctx, {
      type: "line",
      data: {
        labels: MESES_LABELS,
        datasets: [{
          label: prod.nombre,
          data: datos,
          borderColor: "#D4954D",
          backgroundColor: "rgba(212,149,77,0.10)",
          borderWidth: 3,
          pointRadius: 5,
          pointHoverRadius: 8,
          tension: 0.4,
          fill: true
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: "Evolución de precio: " + prod.nombre + " (🏪 " + prod.tienda + ")",
            font: { size: 14, weight: "bold" },
            color: "#333"
          },
          tooltip: {
            callbacks: {
              label: ctx => " Precio: " + formatCOP(ctx.parsed.y)
            }
          },
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: false,
            ticks: {
              callback: val => "$ " + val.toLocaleString("es-CO"),
              font: { size: 10 }
            },
            grid: { color: "#f0f0f0" }
          },
          x: { grid: { color: "#f5f5f5" } }
        }
      }
    });
  }

  // Poblar select de evolución
  function poblarSelectEvolucion() {
    const select = document.getElementById("selectProductoEvolucion");
    PRODUCTOS.forEach(p => {
      const opt = document.createElement("option");
      opt.value = p.nombre;
      opt.textContent = p.nombre + " — " + p.tienda;
      select.appendChild(opt);
    });
    select.addEventListener("change", e => construirGraficaEvolucion(e.target.value));
  }

  // Tabs de gráficas
  function mostrarTab(tab) {
    const paneles = { categoria: "panelCategoria", tienda: "panelTienda", evolucion: "panelEvolucion" };
    const tabs = { categoria: "tabCategoria", tienda: "tabTienda", evolucion: "tabEvolucion" };
    Object.entries(paneles).forEach(([k, id]) => {
      document.getElementById(id).style.display = k === tab ? "" : "none";
    });
    Object.entries(tabs).forEach(([k, id]) => {
      document.getElementById(id).classList.toggle("active", k === tab);
    });
    // Construir la gráfica al mostrarla (lazy)
    if (tab === "categoria" && !chartCategoria) construirGraficaCategoria();
    if (tab === "tienda" && !chartTienda) construirGraficaTienda();
    if (tab === "evolucion" && !chartEvolucion) {
      const sel = document.getElementById("selectProductoEvolucion");
      construirGraficaEvolucion(sel.value);
    }
  }
</script>

</body>
